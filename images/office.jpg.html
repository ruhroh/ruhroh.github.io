<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Office Image Placeholder</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        .placeholder {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #4a6fa5 0%, #c8a35f 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
        }
        .content {
            max-width: 600px;
        }
        h1 {
            font-size: 2rem;
            margin-bottom: 1rem;
        }
        p {
            font-size: 1rem;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div class="placeholder">
        <div class="content">
            <h1>Law Firm Office Image</h1>
            <p>This is a placeholder for the office image. In a production environment, this would be replaced with a professional photograph of the law firm's office interior, showing a modern, professional workspace.</p>
            <p>Recommended image dimensions: 800x600px</p>
        </div>
    </div>
</body>
</html>
