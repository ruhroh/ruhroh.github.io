<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attorney 1 Image Placeholder</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        .placeholder {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1a365d 0%, #2a4a7d 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
        }
        .attorney-silhouette {
            width: 150px;
            height: 150px;
            background-color: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            margin: 0 auto 20px;
            position: relative;
        }
        .attorney-silhouette::after {
            content: '';
            position: absolute;
            top: 25px;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 60px;
            background-color: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
        }
        .attorney-silhouette::before {
            content: '';
            position: absolute;
            top: 100px;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 70px;
            background-color: rgba(255, 255, 255, 0.3);
            border-radius: 50% 50% 0 0;
        }
        .content {
            max-width: 600px;
        }
        h1 {
            font-size: 2rem;
            margin-bottom: 1rem;
        }
        p {
            font-size: 1rem;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div class="placeholder">
        <div class="content">
            <div class="attorney-silhouette"></div>
            <h1>Jane Smith</h1>
            <p>Managing Partner</p>
            <p>This is a placeholder for the attorney image. In a production environment, this would be replaced with a professional headshot of the attorney.</p>
            <p>Recommended image dimensions: 400x600px</p>
        </div>
    </div>
</body>
</html>
